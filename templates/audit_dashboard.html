<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit - Authors Activity</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles for Audit Dashboard */
        #authors-table-body tr { transition: background-color 0.15s ease; }
        #authors-table-body tr:hover { background-color: #f8fafc; }
        .status-badge {
            display: inline-flex; align-items: center;
            padding: 0.25rem 0.75rem; border-radius: 9999px;
            font-size: 0.75rem; font-weight: 600;
        }
        .status-active { background-color: #d1fae5; color: #065f46; }
        .status-inactive { background-color: #fee2e2; color: #991b1b; }
        .days-recent { color: #059669; font-weight: 600; }
        .days-warning { color: #d97706; font-weight: 600; }
        .days-danger { color: #dc2626; font-weight: 600; }
        code { font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace; font-size: 0.875rem; }
        .truncate-cell { max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">
    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-6 flex items-center justify-between h-16">
            <div class="flex items-center gap-3">
                <span class="text-2xl">📊</span>
                <h1 class="text-xl font-bold text-slate-800">Audit Dashboard</h1>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="refreshData()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">
                    🔄 Atualizar
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto p-6">
        <!-- Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-white rounded-xl p-5 shadow-sm border border-slate-200">
                <p class="text-xs font-semibold text-slate-500 uppercase tracking-wide">Total Authors</p>
                <p class="text-3xl font-bold text-slate-800 mt-1" id="stat-total">-</p>
            </div>
            <div class="bg-white rounded-xl p-5 shadow-sm border border-slate-200">
                <p class="text-xs font-semibold text-emerald-500 uppercase tracking-wide">Ativos (30d)</p>
                <p class="text-3xl font-bold text-emerald-600 mt-1" id="stat-active">-</p>
            </div>
            <div class="bg-white rounded-xl p-5 shadow-sm border border-slate-200">
                <p class="text-xs font-semibold text-rose-500 uppercase tracking-wide">Inativos (30d)</p>
                <p class="text-3xl font-bold text-rose-600 mt-1" id="stat-inactive">-</p>
            </div>
            <div class="bg-white rounded-xl p-5 shadow-sm border border-slate-200">
                <p class="text-xs font-semibold text-amber-500 uppercase tracking-wide">Never Logged In</p>
                <p class="text-3xl font-bold text-amber-600 mt-1" id="stat-never">-</p>
            </div>
        </div>

        <!-- Filters -->
        <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200 mb-6">
            <div class="flex flex-wrap items-center gap-4">
                <div class="flex-1 min-w-[200px]">
                    <label class="block text-sm font-medium text-slate-700 mb-1">Buscar Author</label>
                    <input type="text" id="search-input" placeholder="Email ou ID..."
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                        oninput="filterTable()">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Status</label>
                    <select id="status-filter" class="px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500" onchange="filterTable()">
                        <option value="all">Todos</option>
                        <option value="active">Ativos (30d)</option>
                        <option value="inactive">Inativos (30d)</option>
                        <option value="never">Never Logged In</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Ordenar por</label>
                    <select id="sort-by" class="px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500" onchange="sortTable()">
                        <option value="last_activity_desc">Última Atividade (recente)</option>
                        <option value="last_activity_asc">Última Atividade (antiga)</option>
                        <option value="events_desc">Total de Logins (maior)</option>
                        <option value="events_asc">Total de Logins (menor)</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Table -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-200 flex items-center justify-between">
                <h2 class="text-lg font-semibold text-slate-800">Authors and Ultimo Login</h2>
                <button onclick="exportCSV()" class="text-indigo-600 hover:text-indigo-800 text-sm font-medium">
                    📥 Exportar CSV
                </button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead class="bg-slate-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wide">Author ID</th>
                            <th class="px-6 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wide">Email</th>
                            <th class="px-6 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wide">Última Atividade</th>
                            <th class="px-6 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wide">Dias Inativo</th>
                            <th class="px-6 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wide">Total de Logins</th>
                            <th class="px-6 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wide">Status</th>
                        </tr>
                    </thead>
                    <tbody id="authors-table-body" class="divide-y divide-slate-200">
                        <tr>
                            <td colspan="6" class="px-6 py-8 text-center text-slate-500">
                                <div class="flex items-center justify-center gap-2">
                                    <svg class="animate-spin h-5 w-5 text-indigo-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                    </svg>
                                    Carregando dados...
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-4 right-4 translate-y-20 opacity-0 transition-all duration-300 z-50">
        <div class="bg-slate-800 text-white px-6 py-3 rounded-lg shadow-lg flex items-center gap-2">
            <span id="toast-icon">✅</span>
            <span id="toast-message"></span>
        </div>
    </div>

    <script>
        // Global state
        let allData = [];
        let filteredData = [];
        const INACTIVE_THRESHOLD_DAYS = 30;

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            refreshData();
        });

        // Show toast notification
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastIcon = document.getElementById('toast-icon');
            const toastMessage = document.getElementById('toast-message');
            
            toastIcon.textContent = type === 'success' ? '✅' : type === 'error' ? '❌' : 'ℹ️';
            toastMessage.textContent = message;
            
            toast.classList.remove('translate-y-20', 'opacity-0');
            
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        // Fetch data from backend
        async function refreshData() {
            try {
                showToast('Carregando dados...', 'info');
                
                const data = await get_authors_activity();
                allData = data.map(row => ({
                    ...row,
                    days_inactive: calculateDaysInactive(row.last_activity)
                }));
                
                updateStats();
                filterTable();
                
                showToast('Dados atualizados com sucesso!');
            } catch (error) {
                console.error('Error fetching data:', error);
                showToast('Erro ao carregar dados: ' + error.message, 'error');
                
                document.getElementById('authors-table-body').innerHTML = `
                    <tr>
                        <td colspan="6" class="px-6 py-8 text-center text-rose-500">
                            ❌ Erro ao carregar dados. Verifique o console para mais detalhes.
                        </td>
                    </tr>
                `;
            }
        }

        // Calculate days since last activity (null = never logged in)
        function calculateDaysInactive(lastActivity) {
            if (!lastActivity) return null;
            const lastDate = new Date(lastActivity);
            const now = new Date();
            const diffTime = Math.abs(now - lastDate);
            return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        }

        function isActiveRow(row) {
            return row.days_inactive !== null && row.days_inactive <= INACTIVE_THRESHOLD_DAYS;
        }

        function isNeverRow(row) {
            return row.days_inactive === null;
        }

        // Update statistics cards
        function updateStats() {
            const total = allData.length;
            const active = allData.filter(isActiveRow).length;
            const never = allData.filter(isNeverRow).length;
            const inactive = total - active - never;

            document.getElementById('stat-total').textContent = total;
            document.getElementById('stat-active').textContent = active;
            document.getElementById('stat-inactive').textContent = inactive;
            document.getElementById('stat-never').textContent = never;
        }

        // Filter table based on search and status
        function filterTable() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const statusFilter = document.getElementById('status-filter').value;

            filteredData = allData.filter(row => {
                const matchesSearch = !searchTerm ||
                    (row.author_id && row.author_id.toLowerCase().includes(searchTerm)) ||
                    (row.author_email && row.author_email.toLowerCase().includes(searchTerm));

                const matchesStatus = statusFilter === 'all' ||
                    (statusFilter === 'active' && isActiveRow(row)) ||
                    (statusFilter === 'inactive' && !isActiveRow(row) && !isNeverRow(row)) ||
                    (statusFilter === 'never' && isNeverRow(row));

                return matchesSearch && matchesStatus;
            });

            sortTable();
        }

        // Sort table — null last_activity always pushed to bottom regardless of direction
        function sortTable() {
            const sortBy = document.getElementById('sort-by').value;

            filteredData.sort((a, b) => {
                if (sortBy.startsWith('last_activity')) {
                    if (!a.last_activity && !b.last_activity) return 0;
                    if (!a.last_activity) return 1;
                    if (!b.last_activity) return -1;
                    return sortBy === 'last_activity_desc'
                        ? new Date(b.last_activity) - new Date(a.last_activity)
                        : new Date(a.last_activity) - new Date(b.last_activity);
                }
                if (sortBy === 'events_desc') return (b.total_logins || 0) - (a.total_logins || 0);
                if (sortBy === 'events_asc') return (a.total_logins || 0) - (b.total_logins || 0);
                return 0;
            });

            renderTable();
        }

        // Get CSS class for days inactive
        function getDaysClass(days) {
            if (days === null) return 'days-danger';
            if (days <= 7) return 'days-recent';
            if (days <= 30) return 'days-warning';
            return 'days-danger';
        }

        // Render table rows
        function renderTable() {
            const tbody = document.getElementById('authors-table-body');

            if (filteredData.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" class="px-6 py-8 text-center text-slate-500">
                            Nenhum resultado encontrado.
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = filteredData.map(row => {
                const never = isNeverRow(row);
                const active = isActiveRow(row);
                const statusClass = never ? 'status-inactive' : (active ? 'status-active' : 'status-inactive');
                const statusText = never ? 'Never logged in' : (active ? 'Ativo' : 'Inativo');
                const daysClass = getDaysClass(row.days_inactive);
                const daysText = never ? '—' : `${row.days_inactive} dias`;
                const lastActivityText = never ? '—' : formatDateTime(row.last_activity);

                return `
                    <tr class="hover:bg-slate-50">
                        <td class="px-6 py-4">
                            <code class="text-xs bg-slate-100 px-2 py-1 rounded truncate-cell" title="${escapeHtml(row.author_id || 'N/A')}">
                                ${escapeHtml(truncateString(row.author_id || 'N/A', 20))}
                            </code>
                        </td>
                        <td class="px-6 py-4 text-sm text-slate-700 truncate-cell" title="${escapeHtml(row.author_email || 'N/A')}">
                            ${escapeHtml(row.author_email || 'N/A')}
                        </td>
                        <td class="px-6 py-4 text-sm text-slate-700">
                            ${lastActivityText}
                        </td>
                        <td class="px-6 py-4 text-sm ${daysClass}">
                            ${daysText}
                        </td>
                        <td class="px-6 py-4 text-sm text-slate-700">
                            ${row.total_logins || 0}
                        </td>
                        <td class="px-6 py-4">
                            <span class="status-badge ${statusClass}">
                                ${statusText}
                            </span>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // Format date for display
        function formatDateTime(dateString) {
            if (!dateString) return 'N/A';
            const date = new Date(dateString);
            return date.toLocaleString('pt-BR', {
                day: '2-digit', month: '2-digit', year: 'numeric',
                hour: '2-digit', minute: '2-digit'
            });
        }

        // Truncate string with ellipsis
        function truncateString(str, maxLength) {
            if (!str || str.length <= maxLength) return str;
            return str.substring(0, maxLength) + '...';
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Export data to CSV
        function exportCSV() {
            if (filteredData.length === 0) {
                showToast('Nenhum dado para exportar', 'error');
                return;
            }
            
            const headers = ['Author ID', 'Email', 'Última Atividade', 'Dias Inativo', 'Total de Logins', 'Status'];
            const rows = filteredData.map(row => {
                const status = isNeverRow(row) ? 'Never logged in' : (isActiveRow(row) ? 'Ativo' : 'Inativo');
                return [
                    row.author_id || '',
                    row.author_email || '',
                    row.last_activity || '',
                    row.days_inactive === null ? '' : row.days_inactive,
                    row.total_logins || 0,
                    status
                ];
            });
            
            const csvContent = [
                headers.join(','),
                ...rows.map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(','))
            ].join('\n');
            
            const blob = new Blob(['\ufeff' + csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `authors_activity_${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
            
            showToast('CSV exportado com sucesso!');
        }
    </script>
</body>
</html>
